<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>

    <!-- فونت فارسی -->
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <div class="bg-particles"></div>

    <div class="container">
      <div class="glass-card">
        <!-- HEADER -->
        <div class="header">
          <h1 id="appTitle"><span>✅</span> لیست کارهای جاری</h1>

          <div class="header-controls">
            <button id="themeToggle" class="theme-toggle">🌙 دارک</button>

            <button id="langToggle" class="lang-toggle">EN</button>

            <select id="sortSelect" class="sort-select">
              <option value="deadline">📅 مرتب‌سازی: تاریخ ددلاین</option>
              <option value="priority">🎯 مرتب‌سازی: اولویت</option>
              <option value="title">🔤 مرتب‌سازی: عنوان</option>
            </select>
          </div>
        </div>

        <!-- FORM -->
        <div class="form-section">
          <div class="form-grid">
            <div class="input-group">
              <label id="labelTitle">عنوان کار *</label>
              <input
                id="taskTitle"
                type="text"
                placeholder="مثال: تحویل پروژه"
              />
            </div>

            <div class="input-group">
              <label id="labelDeadline">ددلاین *</label>
              <input id="taskDeadline" type="date" />
            </div>

            <div class="input-group">
              <label id="labelPriority">اولویت</label>
              <select id="taskPriority">
                <option value="low">🟢 کم</option>
                <option value="medium">🟡 متوسط</option>
                <option value="high">🔴 بالا</option>
              </select>
            </div>

            <div class="input-group">
              <label>&nbsp;</label>
              <button id="addBtn" class="btn-add">➕ افزودن کار</button>
            </div>
          </div>

          <div class="input-group">
            <label id="labelDesc">توضیحات</label>
            <textarea id="taskDesc" rows="2"></textarea>
          </div>
        </div>

        <!-- FILTERS -->
        <div class="filters-section">
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">همه</button>
            <button class="filter-btn" data-filter="pending">در انتظار</button>
            <button class="filter-btn" data-filter="completed">
              انجام شده
            </button>
            <button class="filter-btn" data-filter="expired">
              ⏰ تاریخ گذشته
            </button>
          </div>

          <div class="search-box">
            <input id="searchInput" type="text" placeholder="🔍 جستجو..." />
          </div>

          <div id="statsInfo" class="stats-card">📊 ۰ کار</div>
        </div>

        <!-- TASKS -->
        <div class="tasks-section">
          <ul id="taskList" class="task-list">
            <li class="empty-msg" id="emptyMsg">
              🌟 به لیست کارهای خود خوش آمدید!
            </li>
          </ul>
        </div>
      </div>
    </div>

    <footer>
      <div class="rights">
        ساخته شده توسط
        <a href="https://github.com/MahdMsv">مهدی موسوی</a>
      </div>
    </footer>

    <script src="assets/js/main.js" defer></script>
  </body>
</html>
